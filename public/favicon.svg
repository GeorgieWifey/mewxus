<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Frame Background -->
  <rect width="32" height="32" fill="#eff1f5"/>
  <rect x="0" y="0" width="32" height="2" fill="#4c4f69"/>
  <rect x="0" y="30" width="32" height="2" fill="#4c4f69"/>
  <rect x="0" y="0" width="2" height="32" fill="#4c4f69"/>
  <rect x="30" y="0" width="2" height="32" fill="#4c4f69"/>

  <!-- Ears -->
  <rect x="4" y="4" width="6" height="6" fill="#dc8a78"/>
  <rect x="22" y="4" width="6" height="6" fill="#dc8a78"/>
  <rect x="6" y="6" width="3" height="3" fill="#ea76cb"/>
  <rect x="23" y="6" width="3" height="3" fill="#ea76cb"/>
  
  <!-- Head -->
  <rect x="4" y="9" width="24" height="17" fill="#eff1f5"/>
  <rect x="2" y="11" width="28" height="13" fill="#eff1f5"/>
  
  <!-- Eyes -->
  <rect x="8" y="13" width="3" height="4" fill="#4c4f69"/>
  <rect x="21" y="13" width="3" height="4" fill="#4c4f69"/>
  <rect x="9" y="14" width="1" height="1" fill="#eff1f5"/>
  <rect x="22" y="14" width="1" height="1" fill="#eff1f5"/>

  <!-- Whiskers -->
  <rect x="2" y="17" width="4" height="1" fill="#4c4f69"/>
  <rect x="2" y="20" width="4" height="1" fill="#4c4f69"/>
  <rect x="26" y="17" width="4" height="1" fill="#4c4f69"/>
  <rect x="26" y="20" width="4" height="1" fill="#4c4f69"/>

  <!-- Cheeks -->
  <rect x="6" y="18" width="3" height="2" fill="#ea76cb"/>
  <rect x="23" y="18" width="3" height="2" fill="#ea76cb"/>

  <!-- Nose & Mouth -->
  <rect x="15" y="18" width="2" height="1" fill="#ea76cb"/>
  <rect x="14" y="20" width="1" height="1" fill="#4c4f69"/>
  <rect x="17" y="20" width="1" height="1" fill="#4c4f69"/>
  <rect x="15" y="21" width="2" height="1" fill="#4c4f69"/>
</svg>
